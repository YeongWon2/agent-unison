name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'YeongWon2/agent-unison' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: 릴리즈 전 검증
        run: npm run check
      - name: Claude Code 플러그인 strict 검증
        run: npm run validate:claude
      - name: 버전 PR 또는 병합된 버전의 릴리즈 생성
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: 릴리즈 PR의 CI 실행
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(node -e 'const pr = JSON.parse(process.env.RELEASE_PR); if (typeof pr.headBranchName !== "string" || !pr.headBranchName.startsWith("release-please--")) process.exit(1); process.stdout.write(pr.headBranchName);')
          gh workflow run ci.yml --ref "$branch"
